<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Initial Low-RPM Green-Lime Gradient (tuned for crisp 16px-48px legibility) -->
    <radialGradient id="favGreenStartGrad" cx="410" cy="340" r="740" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAFA32" />
      <stop offset="28%" stop-color="#64E63A" />
      <stop offset="58%" stop-color="#28D24E" />
      <stop offset="85%" stop-color="#16B846" />
      <stop offset="100%" stop-color="#0EA23E" />
    </radialGradient>

    <!-- Mid-Range Chartreuse / Sunburst Yellow Gradient (bridges Green -> Boost Orange cleanly) -->
    <radialGradient id="favYellowMidGrad" cx="510" cy="245" r="750" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFF30" />
      <stop offset="26%" stop-color="#FFEC20" />
      <stop offset="56%" stop-color="#FFD412" />
      <stop offset="82%" stop-color="#FFBA08" />
      <stop offset="100%" stop-color="#FA9E04" />
    </radialGradient>

    <!-- High-Contrast Optical Boost Orange-Gold Gradient (final resting state) -->
    <radialGradient id="favOrangeGrad" cx="615" cy="175" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD836" />
      <stop offset="22%" stop-color="#FFA30C" />
      <stop offset="52%" stop-color="#FE7E03" />
      <stop offset="80%" stop-color="#FC5602" />
      <stop offset="100%" stop-color="#EE3D00" />
    </radialGradient>

    <!-- High-Load Struggle Vivid Scarlet-Red Gradient (luminous red, never dark maroon) -->
    <radialGradient id="favRedHeatGrad" cx="780" cy="285" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF622B" />
      <stop offset="25%" stop-color="#FF3C16" />
      <stop offset="55%" stop-color="#FA220E" />
      <stop offset="82%" stop-color="#E81B09" />
      <stop offset="100%" stop-color="#D41908" />
    </radialGradient>

    <!-- Light-Theme Bold Metallic Slate Track Gradient -->
    <radialGradient id="favDarkGrad" cx="1180" cy="465" r="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="46%" stop-color="#858790" />
      <stop offset="62%" stop-color="#4A4C53" />
      <stop offset="78%" stop-color="#27292E" />
      <stop offset="100%" stop-color="#1E2025" />
    </radialGradient>

    <!-- Dark-Theme Light Metallic Gray Track Gradient (desktop prefers-color-scheme: dark) -->
    <radialGradient id="favDarkGradNight" cx="1150" cy="465" r="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="48%" stop-color="#D5D9E3" />
      <stop offset="70%" stop-color="#B4BAC8" />
      <stop offset="100%" stop-color="#8A92A2" />
    </radialGradient>

    <!-- Light-Theme Deep Carbon-Slate Bold Needle Gradient -->
    <linearGradient id="favNeedleGrad" x1="395" y1="635" x2="802" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0E10" />
      <stop offset="45%" stop-color="#1A1B20" />
      <stop offset="80%" stop-color="#25272E" />
      <stop offset="100%" stop-color="#1F2026" />
    </linearGradient>

    <!-- Dark-Theme Brushed Light-Gray Bold Needle Gradient (desktop prefers-color-scheme: dark) -->
    <linearGradient id="favNeedleGradNight" x1="395" y1="635" x2="802" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C0C7D4" />
      <stop offset="45%" stop-color="#D6DCE8" />
      <stop offset="82%" stop-color="#E6EBF4" />
      <stop offset="100%" stop-color="#F1F4FA" />
    </linearGradient>

    <!-- Left-to-Right Specular Shimmer Band -->
    <linearGradient id="favShimmerGrad" x1="0" y1="0.2" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="45%" stop-color="#FFE8C8" stop-opacity="0.44" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.54" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <path id="favFullDialRing" d="M 178.23,854.32 A 464.00,464.00 0 1 1 859.52,839.46 A 89.00,89.00 0 0 1 726.20,721.50 A 286.00,286.00 0 0 0 395.67,270.73 A 402.64,402.64 0 0 0 206.93,833.12 A 18.00,18.00 0 0 1 178.23,854.32 Z" />

    <clipPath id="favDialClip">
      <use href="#favFullDialRing" />
    </clipPath>

    <!-- Wide 70px-per-side Anti-Bleed Clearance Wedge -->
    <polygon id="favGapWedge" points="547.21,365.34 867.55,180.18 946.18,277.45 697.98,551.86" />

    <!-- Circular Mask Spine Centered at Favicon Pivot (512.0, 548.0), R=376, Span=295 deg (1935.92px) -->
    <path id="favDialSpine" d="M 296.34,856.00 A 376,376 0 0 1 512.00,172.00 A 376,376 0 0 1 700.00,873.63" />
  </defs>

  <style>
    @keyframes favRotorSweep {
      0%           { transform: rotate(-189.0deg); animation-timing-function: cubic-bezier(0.25, 0.9, 0.35, 1); }
      5.5%         { transform: rotate(-150.0deg); animation-timing-function: cubic-bezier(0.45, 0, 0.65, 1); }
      10.5%        { transform: rotate(-166.0deg); animation-timing-function: cubic-bezier(0.22, 0.82, 0.36, 1); }
      25%          { transform: rotate(-98.0deg);  animation-timing-function: cubic-bezier(0.4, 0, 0.7, 1); }
      30%          { transform: rotate(-112.0deg); animation-timing-function: cubic-bezier(0.22, 0.80, 0.36, 1); }
      47%          { transform: rotate(-50.0deg);  animation-timing-function: cubic-bezier(0.4, 0, 0.7, 1); }
      52.5%        { transform: rotate(-64.0deg);  animation-timing-function: cubic-bezier(0.18, 0.75, 0.35, 1); }
      65%          { transform: rotate(-21.0deg);  animation-timing-function: cubic-bezier(0.35, 0.6, 0.5, 1); }
      69%          { transform: rotate(-14.5deg);  animation-timing-function: ease-in-out; }
      72%          { transform: rotate(-17.2deg);  animation-timing-function: cubic-bezier(0.25, 0.8, 0.4, 1); }
      77%          { transform: rotate(-6.8deg);   animation-timing-function: ease-in-out; }
      79.5%        { transform: rotate(-9.0deg);   animation-timing-function: cubic-bezier(0.2, 0.85, 0.35, 1); }
      84%          { transform: rotate(2.6deg);    animation-timing-function: ease-in-out; }
      85.8%        { transform: rotate(-0.8deg);   animation-timing-function: ease-in-out; }
      87.4%        { transform: rotate(1.4deg);    animation-timing-function: ease-out; }
      89%, 100%    { transform: rotate(0deg); }
    }

    @keyframes favSpineSweep {
      0%           { stroke-dashoffset: 1889.65; animation-timing-function: cubic-bezier(0.25, 0.9, 0.35, 1); }
      5.5%         { stroke-dashoffset: 1633.72; animation-timing-function: cubic-bezier(0.45, 0, 0.65, 1); }
      10.5%        { stroke-dashoffset: 1738.72; animation-timing-function: cubic-bezier(0.22, 0.82, 0.36, 1); }
      25%          { stroke-dashoffset: 1292.47; animation-timing-function: cubic-bezier(0.4, 0, 0.7, 1); }
      30%          { stroke-dashoffset: 1384.35; animation-timing-function: cubic-bezier(0.22, 0.80, 0.36, 1); }
      47%          { stroke-dashoffset:  977.48; animation-timing-function: cubic-bezier(0.4, 0, 0.7, 1); }
      52.5%        { stroke-dashoffset: 1069.35; animation-timing-function: cubic-bezier(0.18, 0.75, 0.35, 1); }
      65%          { stroke-dashoffset:  787.16; animation-timing-function: cubic-bezier(0.35, 0.6, 0.5, 1); }
      69%          { stroke-dashoffset:  744.51; animation-timing-function: ease-in-out; }
      72%          { stroke-dashoffset:  762.23; animation-timing-function: cubic-bezier(0.25, 0.8, 0.4, 1); }
      77%          { stroke-dashoffset:  693.98; animation-timing-function: ease-in-out; }
      79.5%        { stroke-dashoffset:  708.42; animation-timing-function: cubic-bezier(0.2, 0.85, 0.35, 1); }
      84%          { stroke-dashoffset:  632.29; animation-timing-function: ease-in-out; }
      85.8%        { stroke-dashoffset:  654.60; animation-timing-function: ease-in-out; }
      87.4%        { stroke-dashoffset:  640.17; animation-timing-function: ease-out; }
      89%, 100%    { stroke-dashoffset:  649.35; }
    }

    @keyframes favGreenStartSweep {
      0%, 19%      { opacity: 1.00; }
      25%          { opacity: 0.78; }
      30%          { opacity: 0.52; }
      41%, 100%    { opacity: 0; }
    }

    @keyframes favYellowMidSweep {
      0%, 47%      { opacity: 1.00; }
      52.5%        { opacity: 0.78; }
      60.5%, 100%  { opacity: 0; }
    }

    @keyframes favRedHeatSweep {
      0%, 59%      { opacity: 0; }
      65%          { opacity: 0.45; }
      69%          { opacity: 0.68; }
      72%          { opacity: 0.55; }
      77%          { opacity: 0.86; }
      79.5%        { opacity: 0.74; }
      84%          { opacity: 1.00; }
      85.8%        { opacity: 0.92; }
      87.4%, 89.5% { opacity: 1.00; }
      95.8%, 100%  { opacity: 0; }
    }

    @keyframes favShimmerSweep {
      0%, 87%      { transform: translateX(0px);    opacity: 0; }
      90%          { opacity: 1; }
      97.5%        { transform: translateX(1420px); opacity: 1; }
      99.5%, 100%  { transform: translateX(1520px); opacity: 0; }
    }

    .fav-rotor {
      animation: favRotorSweep 5.2s forwards;
      will-change: transform;
    }
    .fav-spine {
      animation: favSpineSweep 5.2s forwards;
    }
    .fav-greenstart {
      animation: favGreenStartSweep 5.2s ease-in-out forwards;
      will-change: opacity;
    }
    .fav-yellowmid {
      animation: favYellowMidSweep 5.2s ease-in-out forwards;
      will-change: opacity;
    }
    .fav-redheat {
      animation: favRedHeatSweep 5.2s ease-in-out forwards;
      will-change: opacity;
    }
    .fav-shimmer {
      animation: favShimmerSweep 5.2s ease-in-out forwards;
      will-change: transform, opacity;
    }

    .fav-track  { fill: url(#favDarkGrad); }
    .fav-needle { fill: url(#favNeedleGrad); }
    @media (prefers-color-scheme: dark) {
      .fav-track  { fill: url(#favDarkGradNight); }
      .fav-needle { fill: url(#favNeedleGradNight); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fav-rotor, .fav-spine, .fav-greenstart, .fav-yellowmid, .fav-redheat, .fav-shimmer {
        animation: none !important;
      }
      .fav-greenstart, .fav-yellowmid, .fav-redheat, .fav-shimmer {
        opacity: 0 !important;
      }
    }
  </style>

  <!-- Mask 1: Unlit Metallic Crescent ahead of needle -->
  <mask id="favDarkSplitMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#FFFFFF" />
    <use href="#favDialSpine" class="fav-spine" fill="none" stroke="#000000" stroke-width="250" stroke-linecap="butt" stroke-dasharray="1935.92 2600" stroke-dashoffset="649.35" />
    <g transform="translate(512.0 548.0)">
      <g class="fav-rotor">
        <use href="#favGapWedge" transform="translate(-512.0 -548.0)" fill="#000000" />
      </g>
    </g>
  </mask>

  <!-- Mask 2: Ignited Boost Crescent behind needle -->
  <mask id="favOrangeSplitMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <rect width="1024" height="1024" fill="#000000" />
    <use href="#favDialSpine" class="fav-spine" fill="none" stroke="#FFFFFF" stroke-width="250" stroke-linecap="butt" stroke-dasharray="1935.92 2600" stroke-dashoffset="649.35" />
    <g transform="translate(512.0 548.0)">
      <g class="fav-rotor">
        <use href="#favGapWedge" transform="translate(-512.0 -548.0)" fill="#000000" />
      </g>
    </g>
  </mask>

  <!-- 1. Ahead Metallic Track (adapts to light gray in dark desktop theme) -->
  <use class="fav-track" href="#favFullDialRing" mask="url(#favDarkSplitMask)" />

  <!-- 2. Ignited Boost Track (Green -> Yellow-Gold -> Boost Orange -> Vivid Red -> settles on Orange) -->
  <g mask="url(#favOrangeSplitMask)">
    <use href="#favFullDialRing" fill="url(#favOrangeGrad)" />
    <use href="#favFullDialRing" class="fav-yellowmid" fill="url(#favYellowMidGrad)" opacity="0" />
    <use href="#favFullDialRing" class="fav-greenstart" fill="url(#favGreenStartGrad)" opacity="0" />
    <use href="#favFullDialRing" class="fav-redheat" fill="url(#favRedHeatGrad)" opacity="0" />
    <g clip-path="url(#favDialClip)">
      <rect class="fav-shimmer" x="-380" y="50" width="360" height="840" fill="url(#favShimmerGrad)" opacity="0" />
    </g>
  </g>

  <!-- 3. Bold Optical Gauge Needle (adapts to brushed light gray in dark desktop theme) -->
  <g transform="translate(512.0 548.0)">
    <g class="fav-rotor">
      <path class="fav-needle" transform="translate(-512.0 -548.0)" d="M 515.27,649.52 A 82.00,82.00 0 1 1 413.42,523.53 Q 594.66,410.68 782.91,309.96 A 15.00,15.00 0 0 1 801.54,333.01 Q 663.59,495.96 515.27,649.52 Z" />
    </g>
  </g>
</svg>
